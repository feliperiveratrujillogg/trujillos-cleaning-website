<style>
:root{
  --blue-700:#17518F;
  --blue-600:#1E5FA8;
  --blue-500:#2B6FBE;
  --blue-100:#E8F0F9;
  --blue-50:#F2F7FC;
  --navy-900:#0A1B30;
  --ink:#16202B;
  --slate:#54636F;
  --line:#E4E9EF;
  --font-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:16px;
  --shadow-md:0 12px 32px rgba(10,27,48,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--blue-50);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue-500);outline-offset:3px;border-radius:4px}

.top-bar{
  padding:1.4rem clamp(1.2rem,4vw,2.4rem);
}
.brand{display:inline-flex;align-items:center;gap:.7rem}
.brand-logo{height:44px;width:auto}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.02rem;color:var(--navy-900);letter-spacing:-.01em}
.brand-sub{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}

main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1.2rem 4rem;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  padding:clamp(2.2rem,6vw,3.2rem);
  max-width:480px;
  width:100%;
  text-align:center;
}
.ok{
  width:68px;height:68px;border-radius:50%;background:var(--blue-100);
  display:grid;place-items:center;margin:0 auto 1.3rem;color:var(--blue-600);
}
h1{
  font-family:var(--font-display);
  font-size:clamp(1.5rem,4vw,1.85rem);
  line-height:1.15;
  letter-spacing:-.02em;
  color:var(--navy-900);
  margin-bottom:.7rem;
}
.card p{color:var(--slate);font-size:.98rem;line-height:1.55;max-width:38ch;margin:0 auto}
.card p + p{margin-top:.8rem}
.actions{
  display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;
  margin-top:1.8rem;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.85rem 1.5rem;border-radius:999px;font-weight:600;font-size:.94rem;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.btn-primary{background:var(--blue-600);color:#fff}
.btn-primary:hover{background:var(--blue-700);transform:translateY(-2px)}
.btn-ghost{border:1.5px solid var(--line);background:#fff;color:var(--navy-900)}
.btn-ghost:hover{border-color:var(--blue-500);color:var(--blue-700);transform:translateY(-2px)}
.urgent{
  margin-top:1.6rem;padding-top:1.4rem;border-top:1px solid var(--line);
  font-size:.85rem;color:var(--slate);
}
.urgent a{color:var(--blue-600);font-weight:600}
</style>
</head>
<body>

<div class="top-bar">
  <a class="brand" href="/" aria-label="Trujillo's Cleaning Services — back to home">
    <img class="brand-logo" src="web/logo.png" alt="" aria-hidden="true">
    <span class="brand-text">
      <span class="brand-name">Trujillo's</span>
      <span class="brand-sub">Cleaning Services</span>
    </span>
  </a>
</div>

<main>
  <div class="card">
    <div class="ok" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Request received!</h1>
    <p>Thanks for reaching out to Trujillo's Cleaning Services. We've got your request and our team will call you shortly to schedule your free quote.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Homepage</a>
    </div>
    <p class="urgent">Need to reach us sooner? Call <a href="tel:+19126593049">(912) 659-3049</a>.</p>
  </div>
</main>

</body>
